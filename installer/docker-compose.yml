# Phoenix — Local-First AI Memory Layer
# Start: docker compose up -d
# Dashboard: http://localhost:7777

services:
  phoenix:
    build:
      context: ..
      dockerfile: installer/Dockerfile
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      # Persist data across container rebuilds
      - phoenix-data:/data
    environment:
      - PHOENIX_SERVICE=1
      - PHOENIX_DATA_DIR=/data
      - NODE_ENV=production
      # Optional: set API keys here or via the dashboard setup wizard
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - CEREBRAS_API_KEY=...
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7777/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  phoenix-data:
    driver: local
